name: Integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  integration:
    # Scaffolds each preset with the real CLI and runs uv/pytest/ruff/mypy on the
    # generated project. See PackkitLabs/packkit-actions + scripts/integration.mjs.
    uses: PackkitLabs/packkit-actions/.github/workflows/generator-integration.yml@v1
    with:
      setup-uv: true
