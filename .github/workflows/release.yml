name: Release

# Publishes create-packkit-py to npm via OIDC Trusted Publishing — no NPM_TOKEN.
# NOTE: trusted publishing can only be configured after the package exists on npm,
# so the FIRST publish (1.0.0) is a manual `npm publish` from a maintainer. After
# that: npmjs.com → create-packkit-py → Settings → Trusted Publisher → GitHub
# Actions, repo PackkitJS/create-packkit-py, workflow "release.yml". Then bump the
# version in package.json and run this workflow.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:pkg
      # Uses OIDC (id-token: write) — no token, and provenance is generated automatically.
      - run: npm publish
